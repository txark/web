<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บันทึกกิจกรรม | WAVEVY COUNCIL</title>
  <link rel="icon" href="/img/favicon.png">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/output.css">
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/logs.js"></script>
  <script defer src="/js/layout.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container-app py-8" x-data="logsPage()">
    <div x-show="!ready" class="py-24 text-center text-muted">กำลังตรวจสอบสิทธิ์...</div>

    <div x-show="ready" x-cloak>
      <h1 class="section-title">บันทึกกิจกรรม</h1>
      <p class="mt-1 text-sm text-muted">ใครทำอะไร เมื่อไร จากที่ไหน · เห็นเฉพาะรองประธานสภาขึ้นไปและผู้ดูแลระบบ · เก็บย้อนหลัง 90 วัน</p>

      <!-- ตัวกรอง -->
      <div class="panel mt-6 space-y-3 p-4">
        <div class="space-y-1">
          <p class="text-xs text-muted">หมวดหมู่</p>
          <div class="flex flex-wrap gap-2" role="group" aria-label="หมวดหมู่">
            <template x-for="t in types" :key="t.value">
              <button type="button" class="chip" :aria-pressed="type === t.value" @click="setType(t.value)" x-text="t.label"></button>
            </template>
          </div>
        </div>

        <div class="space-y-1" x-show="events.length">
          <p class="text-xs text-muted">สถานะ</p>
          <div class="flex flex-wrap gap-2" role="group" aria-label="สถานะ">
            <template x-for="e in events" :key="e.value">
              <button type="button" class="chip" :aria-pressed="event === e.value" @click="setEvent(e.value)" x-text="e.label"></button>
            </template>
          </div>
        </div>

        <div class="grid gap-3 md:grid-cols-[1fr_auto_auto]">
          <input type="search" x-model.debounce.300ms="q" class="input" placeholder="ค้นหาจากชื่อผู้กระทำหรือข้อความ" aria-label="ค้นหา">
          <label class="flex items-center gap-2 text-sm text-muted">ตั้งแต่
            <input type="date" x-model="from" :max="to || undefined" class="input w-auto" aria-label="ตั้งแต่วันที่">
          </label>
          <label class="flex items-center gap-2 text-sm text-muted">ถึง
            <input type="date" x-model="to" :min="from || undefined" class="input w-auto" aria-label="ถึงวันที่">
          </label>
        </div>

        <div class="flex flex-wrap items-center gap-2 text-sm" x-show="hasFilter">
          <template x-if="user">
            <span class="badge badge-info inline-flex items-center gap-1">ผู้กระทำ: <b x-text="user.name"></b>
              <button type="button" class="ml-1 opacity-70 hover:opacity-100" @click="clearUser()" aria-label="เอาตัวกรองผู้กระทำออก">✕</button>
            </span>
          </template>
          <button type="button" class="text-muted underline-offset-2 hover:text-accent hover:underline" @click="clearAll()">ล้างตัวกรองทั้งหมด</button>
        </div>
      </div>

      <p x-show="error" x-text="error" class="penalty-box mt-6 text-center"></p>
      <p x-show="loading" class="mt-10 text-center text-muted">กำลังโหลด...</p>
      <p x-show="!loading && !error && rows.length === 0" class="mt-10 text-center text-muted">ไม่พบบันทึกกิจกรรมตามเงื่อนไข</p>

      <p class="mt-5 text-sm text-muted" x-show="meta && rows.length > 0">
        ทั้งหมด <span class="text-fg" x-text="meta ? meta.total.toLocaleString('th-TH') : 0"></span> รายการ
      </p>

      <!-- รายการ -->
      <ul class="mt-3 space-y-2" x-show="rows.length > 0">
        <template x-for="r in rows" :key="r.id">
          <li class="card px-4 py-3">
            <div class="grid gap-x-4 gap-y-1.5 md:grid-cols-[10.5rem_13rem_minmax(0,1fr)_auto] md:items-center">
              <time class="text-xs text-muted md:text-sm" :datetime="r.created_at" x-text="when(r.created_at)"></time>

              <div class="min-w-0">
                <template x-if="r.causer">
                  <button type="button" class="flex min-w-0 items-center gap-2 text-left hover:text-accent" @click="filterUser(r.causer)" title="กรองเฉพาะคนนี้">
                    <img x-show="r.causer.avatar" :src="r.causer.avatar" alt="" class="h-6 w-6 shrink-0 rounded-full">
                    <span class="min-w-0">
                      <span class="block truncate text-sm font-medium" x-text="r.causer.name"></span>
                      <span class="block truncate text-xs text-muted" :title="r.causer.role_name" x-text="r.causer.role_label"></span>
                    </span>
                  </button>
                </template>
                <span x-show="!r.causer" class="text-sm text-muted" x-text="anon(r)"></span>
              </div>

              <div class="flex min-w-0 flex-wrap items-center gap-2">
                <span :class="badge(r.event)" x-text="r.event_label || r.log_label"></span>
                <span class="min-w-0 break-words text-sm" x-text="r.description"></span>
                <span x-show="r.subject" class="text-xs text-muted" x-text="r.subject ? r.subject.label + ' #' + r.subject.id : ''"></span>
                <span x-show="r.summary" class="basis-full break-words text-xs text-muted" x-text="r.summary"></span>
              </div>

              <button type="button" class="text-xs text-accent hover:underline md:justify-self-end" x-show="hasDetail(r)"
                      @click="toggle(r.id)" :aria-expanded="!!open[r.id]" x-text="open[r.id] ? 'ซ่อนรายละเอียด' : 'รายละเอียด'"></button>
            </div>

            <!-- รายละเอียด -->
            <div x-show="open[r.id]" x-cloak class="mt-3 grid gap-3 border-t border-line pt-3 text-sm md:grid-cols-2">
              <dl class="space-y-1" x-show="extras(r).length">
                <template x-for="([k, v], i) in extras(r)" :key="i">
                  <div class="flex gap-3"><dt class="w-28 shrink-0 text-muted" x-text="k"></dt><dd class="min-w-0 break-words" x-text="v"></dd></div>
                </template>
              </dl>
              <div x-show="diff(r).length">
                <p class="mb-1 text-muted">ข้อมูลที่เปลี่ยน</p>
                <ul class="space-y-1">
                  <template x-for="d in diff(r)" :key="d.field">
                    <li class="flex flex-wrap items-baseline gap-x-2">
                      <span class="font-medium" x-text="d.field"></span>
                      <span x-show="d.from !== null" class="text-muted line-through" x-text="d.from"></span>
                      <span x-show="d.from !== null" aria-hidden="true">→</span>
                      <b class="text-accent" x-text="d.to"></b>
                    </li>
                  </template>
                </ul>
              </div>
            </div>
          </li>
        </template>
      </ul>

      <!-- แบ่งหน้า -->
      <div class="mt-8 flex items-center justify-center gap-3 text-sm" x-show="meta && meta.last_page > 1">
        <button class="btn-outline disabled:opacity-40" :disabled="page <= 1" @click="go(page - 1)">ก่อนหน้า</button>
        <span class="text-muted">หน้า <span x-text="page"></span> / <span x-text="meta ? meta.last_page : 1"></span></span>
        <button class="btn-outline disabled:opacity-40" :disabled="!meta || page >= meta.last_page" @click="go(page + 1)">ถัดไป</button>
      </div>
    </div>
  </main>
</body>
</html>
