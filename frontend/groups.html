<!doctype html>
<html lang="th" data-theme="light" data-default-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ทำเนียบ Gang &amp; Family | WAVEVY COUNCIL</title>
  <link rel="icon" href="/img/favicon.png">
  <script src="/js/theme.js"></script>
  <script src="/js/icons.js"></script>
  <link rel="stylesheet" href="/css/output.css">
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/groups.js"></script>
  <script defer src="/js/layout.js"></script>
  <script defer src="/js/select.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body class="pub" x-data="groupsPage()" @keydown.escape.window="closeDetail()">
  <div id="site-header"></div>

  <main class="container-app py-8">
    <header class="pub-hero pub-hero-page">
      <div class="min-w-0">
        <p class="pub-hero-eyebrow">WAVEVY COUNCIL / REGISTRY</p>
        <h1 class="pub-hero-title">ทำเนียบ<span>Gang &amp; Family<i>.</i></span></h1>
        <p class="pub-hero-sub">ทะเบียนแก๊ง / ครอบครัว เลือกสังกัดเพื่อดูรายละเอียด</p>
        <p class="pub-hero-meta"><i aria-hidden="true"></i><span>ข้อมูลทะเบียนปัจจุบัน</span></p>
      </div>
      <div class="pub-hero-stats">
        <p class="pub-hero-tag">REGISTERED.<br>VERIFIED.</p>
        <p class="pub-hero-num"><b x-text="meta ? meta.total : 0"></b></p>
        <p class="pub-hero-cap"><span>สังกัด</span><span>ทั้งหมดในทะเบียน</span></p>
      </div>
    </header>

    <!-- ค้นหา / ตัวกรอง -->
    <section class="pub-filter">
      <label class="pub-filter-label" for="g-q">ค้นหาแก๊ง / ครอบครัว</label>
      <input id="g-q" type="search" x-model.debounce.300ms="q" placeholder="ค้นหาชื่อแก๊ง ครอบครัว หรือตัวย่อ" class="pub-filter-input">
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <template x-for="t in types" :key="t.value">
          <button type="button" class="chip" :aria-pressed="type === t.value" @click="type = t.value; reload()"><span x-text="t.label"></span> <span class="chip-n" x-show="counts[t.value] !== undefined" x-text="counts[t.value]"></span></button>
        </template>
        <label class="pub-check"><input type="checkbox" x-model="protect"><span>อยู่ในช่วง Protect</span></label>
      </div>
      <p class="mt-3 text-xs text-muted" x-show="meta">แสดง <span x-text="groups.length"></span> จาก <span x-text="meta ? meta.total : 0"></span> สังกัด</p>
    </section>

    <p x-show="error" x-text="error" class="penalty-box mt-8 text-center"></p>
    <p x-show="loading" class="mt-12 text-center text-muted">กำลังโหลด...</p>
    <p x-show="!loading && !error && groups.length === 0" class="mt-12 text-center text-muted">ไม่พบ Gang หรือ Family</p>

    <!-- รายการ -->
    <div class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-4" x-show="groups.length > 0">
      <template x-for="g in groups" :key="g.id">
        <button type="button" @click="open(g)" class="gc" :style="'--gc:' + (g.color_hex || 'var(--accent)')">
          <span class="gc-top">
            <span class="gc-pill" x-text="g.status_label"></span>
            <span class="gc-pill" :class="g.protect_active ? 'is-on' : ''" x-text="g.protect_active ? 'มี Protect' : 'ไม่มี Protect'"></span>
          </span>
          <span class="gc-logo">
            <template x-if="g.logo_url"><img :src="g.logo_url" alt=""></template>
            <template x-if="!g.logo_url"><span class="gc-logo-no"><b x-text="g.short_name || g.name.charAt(0).toUpperCase()"></b><small>ยังไม่มีโลโก้</small></span></template>
          </span>
          <span class="gc-name" x-text="g.name"></span>
          <span class="gc-short" x-text="g.short_name || typeTag(g)"></span>
          <span class="gc-row">
            <span><small>Leader</small><b x-text="g.leader || 'ไม่ระบุ'"></b></span>
            <span><small>สี / รหัสสี</small><b><i class="gc-dot" :style="'background:' + (g.color_hex || 'transparent')"></i><span x-text="g.color_name || 'ไม่ระบุชื่อสี'"></span></b><em x-text="g.color_hex || ''"></em></span>
          </span>
          <span class="gc-more">ดูรายละเอียด</span>
        </button>
      </template>
    </div>

    <!-- แบ่งหน้า -->
    <div class="mt-8 flex items-center justify-center gap-3 text-sm" x-show="meta && meta.last_page > 1">
      <button class="btn-outline disabled:opacity-40" :disabled="page <= 1" @click="go(page - 1)">ก่อนหน้า</button>
      <span class="text-muted">หน้า <select class="input !inline-block !w-auto !py-1 !pl-2 !pr-7" aria-label="เลือกหน้า" @change="go(+$event.target.value)"><template x-for="n in Array.from({ length: meta ? meta.last_page : 1 }, (_, i) => i + 1)" :key="n"><option :value="n" :selected="n === page" x-text="n"></option></template></select> / <span x-text="meta ? meta.last_page : 1"></span></span>
      <button class="btn-outline disabled:opacity-40" :disabled="!meta || page >= meta.last_page" @click="go(page + 1)">ถัดไป</button>
    </div>
  </main>

  <!-- รายละเอียด -->
  <div x-show="detail || detailLoading" x-cloak class="fixed inset-0 z-40 grid place-items-center p-4">
    <div class="modal-overlay absolute inset-0" @click="closeDetail()"></div>
    <div class="panel relative max-h-[85vh] w-full max-w-xl overflow-y-auto p-6 shadow-2xl" role="dialog" aria-modal="true">
      <button type="button" class="absolute right-4 top-4 text-muted hover:text-fg" @click="closeDetail()" aria-label="ปิด">✕</button>

      <p x-show="detailLoading" class="py-8 text-center text-muted">กำลังโหลด...</p>

      <template x-if="detail">
        <div>
          <div class="gm-head">
            <template x-if="detail.logo_url"><img :src="detail.logo_url" alt="" class="gm-logo"></template>
            <template x-if="!detail.logo_url"><div class="gm-logo gm-logo-no" :style="detail.color_hex ? 'color:' + detail.color_hex : ''" x-text="detail.name.charAt(0).toUpperCase()"></div></template>
            <div class="min-w-0">
              <p class="eyebrow" x-text="typeTag(detail)"></p>
              <h2 class="gm-name" x-text="detail.name"></h2>
              <p class="gm-short" x-show="detail.short_name" x-text="'[' + detail.short_name + ']'"></p>
            </div>
          </div>

          <div class="gm-badges">
            <span :class="statusClass(detail.status)" x-text="detail.status_label"></span>
            <span x-show="detail.slots_locked" class="badge badge-muted">ล็อก Slot</span>
            <span class="gm-protect" :class="detail.protect_active ? 'is-on' : ''"><i aria-hidden="true"></i><span x-text="detail.protect_active ? 'Protect ON' : 'Protect OFF'"></span></span>
          </div>

          <p x-show="detail.description" class="mt-4 whitespace-pre-line text-sm text-muted" x-text="detail.description"></p>

          <dl class="gm-grid">
            <div class="gm-tile">
              <dt>ชื่อเต็ม</dt>
              <dd x-text="detail.name"></dd>
            </div>
            <div class="gm-tile">
              <dt>ชื่อย่อ</dt>
              <dd x-text="detail.short_name || '—'"></dd>
            </div>
            <div class="gm-tile">
              <dt>สี</dt>
              <dd class="gm-color"><span x-show="detail.color_hex" class="gm-swatch" :style="'background:' + detail.color_hex"></span><span x-text="detail.color_name || detail.color_hex || '—'"></span></dd>
            </div>
            <div class="gm-tile">
              <dt>อยู่ภายใต้สภาตั้งแต่</dt>
              <dd x-text="fmtDate(detail.registered_at)"></dd>
            </div>
            <div class="gm-tile" x-show="detail.status !== 'normal' && detail.status_since">
              <dt>สถานะนี้ตั้งแต่</dt>
              <dd x-text="fmtDate(detail.status_since)"></dd>
            </div>
          </dl>

          <h3 class="gm-h">ประวัติการเล่นสตอรี่ <span x-text="(detail.stories || []).length"></span></h3>
          <ul class="gm-stories">
            <template x-for="s in (detail.stories || [])" :key="s.number">
              <li class="gm-story">
                <div class="gm-vs">
                  <span class="gm-side gm-side-me"><b x-text="detail.name"></b><i x-show="detail.short_name" x-text="detail.short_name"></i></span>
                  <em>VS</em>
                  <span class="gm-side"><b x-text="s.rival ? s.rival.name : '—'"></b><i x-show="s.rival && s.rival.short_name" x-text="s.rival ? s.rival.short_name : ''"></i></span>
                </div>
                <p class="gm-story-meta"><span x-text="storyType(s.story_type)"></span><span x-text="fmtDate(s.date)"></span><span class="gm-state" :class="s.phase_label === 'กำลังเล่น' ? 'is-live' : ''" x-text="s.phase_label"></span></p>
              </li>
            </template>
            <li x-show="!detail.stories || detail.stories.length === 0" class="gm-story-empty">ยังไม่เคยเล่นสตอรี่</li>
          </ul>
        </div>
      </template>
    </div>
  </div>
</body>
</html>
