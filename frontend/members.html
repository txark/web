<!doctype html>
<html lang="th" data-theme="light" data-default-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมาชิกสภา | WAVEVY COUNCIL</title>
  <link rel="icon" href="/img/favicon.png">
  <script src="/js/theme.js"></script>
  <script src="/js/icons.js"></script>
  <link rel="stylesheet" href="/css/output.css">
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/members.js"></script>
  <script defer src="/js/layout.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body class="pub">
  <div id="site-header"></div>

  <main class="container-app py-8" x-data="membersPage()">
    <header class="pub-hero pub-hero-page">
      <div class="min-w-0">
        <p class="pub-hero-eyebrow">WAVEVY COUNCIL / MEMBERS</p>
        <h1 class="pub-hero-title">สมาชิกสภา<span>Council Members<i>.</i></span></h1>
        <p class="pub-hero-sub">ทำความรู้จักตำแหน่งในสภา</p>
      </div>
      <div class="pub-hero-stats">
        <p class="pub-hero-tag">SERVING.<br>LEADING.</p>
        <p class="pub-hero-num"><b>07</b></p>
        <p class="pub-hero-cap"><span>ตำแหน่ง</span><span>ในสภา</span></p>
      </div>
    </header>

    <p x-show="error" x-cloak class="pub-empty" x-text="error"></p>

    <nav class="pub-ranks" aria-label="ตำแหน่ง" x-show="ranks.length" x-cloak>
      <template x-for="r in ranks" :key="r.role"><a :href="'#r-' + r.role" x-text="r.label"></a></template>
    </nav>

    <template x-for="(r, i) in ranks" :key="r.role">
      <section :id="'r-' + r.role" class="pub-rank">
        <div class="pub-rank-head"><span class="n" x-text="pad(i + 1)"></span><h2 x-text="r.label"></h2><span class="c" x-text="r.members.length + ' คน'"></span></div>
        <div x-show="r.members.length" class="pub-members">
          <template x-for="(m, j) in r.members" :key="j"><span class="pub-member" x-text="m.name"></span></template>
        </div>
        <div x-show="!r.members.length" class="pub-empty"><i class="ic" data-icon="users" aria-hidden="true"></i>ยังไม่มีสมาชิกในตำแหน่งนี้</div>
      </section>
    </template>
  </main>

  <footer class="container-app pb-8 pt-2 text-xs text-muted">WAVEVY COUNCIL · เมืองคลื่น</footer>
</body>
</html>
