<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คำขอรออนุมัติ | WAVEVY COUNCIL</title>
  <link rel="icon" href="/img/favicon.png">
  <script src="/js/theme.js"></script>
  <script src="/js/icons.js"></script>
  <link rel="stylesheet" href="/css/output.css">
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/requests.js"></script>
  <script defer src="/js/layout.js"></script>
  <script defer src="/js/txnav.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container-app py-8" x-data="requestsPage()">
    <div x-show="!ready" class="py-24 text-center text-muted">กำลังตรวจสอบสิทธิ์...</div>

    <div x-show="ready" x-cloak class="tx-layout">
      <aside id="tx-sidebar" x-data="txSidebar()"></aside>

      <section class="min-w-0">
        <header class="rg-head">
          <div class="min-w-0">
            <p class="rg-eyebrow">WAVEVY COUNCIL / REQUESTS</p>
            <h1 class="rg-title"><i class="ic rg-ic" data-icon="inbox" aria-hidden="true"></i>คำขอรออนุมัติ</h1>
            <p class="rg-sub">คำขอและธุรกรรมที่รอสภาอนุมัติ · อนุมัติคำขอของตัวเองไม่ได้</p>
          </div>
          <div class="rg-actions">
            <button type="button" class="btn-outline" @click="load()" :disabled="loading" x-text="loading ? 'กำลังโหลด...' : 'รีเฟรช'"></button>
          </div>
        </header>

        <p x-show="err" x-text="err" class="penalty-box mt-5" role="alert"></p>
        <p x-show="msg" x-text="msg" class="note-box mt-5" role="status"></p>

        <div class="mt-5 flex flex-wrap gap-2" x-show="items.length > 0" role="group" aria-label="ชนิดคำขอ">
          <template x-for="k in kinds" :key="k.value">
            <button type="button" class="chip" :aria-pressed="kind === k.value" @click="kind = k.value">
              <span x-text="k.label"></span><span class="ml-1 text-muted" x-text="count(k.value)"></span>
            </button>
          </template>
        </div>

        <div class="panel mt-6 p-8 text-center" x-show="!loading && !err && items.length === 0">
          <span class="empty-ic" aria-hidden="true"><i class="ic" data-icon="check-circle"></i></span>
          <p class="type-sub">ไม่มีคำขอรออนุมัติ</p>
          <p class="mt-1 text-sm text-muted">เมื่อแก๊ง/ครอบครัวยื่นเรื่องเข้ามา จะแสดงที่นี่</p>
        </div>

        <ul class="mt-4 space-y-3" x-show="shown.length > 0">
          <template x-for="t in shown" :key="t.id">
            <li class="card p-4 sm:p-5" :id="'tx-' + t.id" :class="Number(focusId) === t.id ? '!border-[var(--accent)]' : ''">
              <div class="flex flex-wrap items-center gap-2">
                <b class="text-base" x-text="t.kind_label"></b>
                <span class="badge badge-muted" x-text="t.requested_role === 'gang' || t.requested_role === 'family' ? 'ยื่นโดยแก๊ง/ครอบครัว' : 'ยื่นโดยสภา'"></span>
                <span class="ml-auto text-xs text-muted" x-text="t.number + ' · ' + stamp(t.created_at)"></span>
              </div>
              <p class="mt-2" x-text="t.summary"></p>

              <dl class="rq-detail">
                <template x-for="row in details(t)" :key="row[0]">
                  <div><dt x-text="row[0]"></dt><dd x-text="row[1]"></dd></div>
                </template>
              </dl>

              <div class="mt-3" x-show="t.has_photo">
                <p class="text-sm text-muted">รูปตัวละครใส่ชุดกลุ่ม (ต้องมีอย่างน้อย 6 ตัวละคร)</p>
                <a :href="photos[t.id]" target="_blank" rel="noopener" x-show="photos[t.id]"><img :src="photos[t.id]" alt="รูปรายงานความเคลื่อนไหว" class="mt-2 max-h-72 rounded-xl border border-line"></a>
                <p class="mt-2 text-sm text-muted" x-show="!photos[t.id]">กำลังโหลดรูป...</p>
              </div>
              <p class="penalty-box mt-3" role="alert" x-show="itemErr[t.id]" x-text="'อนุมัติไม่สำเร็จ: ' + itemErr[t.id]"></p>
              <p class="mt-3 text-sm" x-show="t.payload && t.payload.fee">ค่าบริการ <b x-text="money(t.payload.fee.total)"></b> WVDL</p>
              <p class="mt-1 text-xs text-muted" x-text="'ผู้ยื่น: ' + (t.requested_by ? t.requested_by.name : '—')"></p>

              <div class="mt-4 flex flex-wrap items-center gap-2 border-t border-line pt-3">
                <template x-if="mine(t)"><p class="text-sm text-muted">คำขอของคุณเอง — ต้องให้สภาคนอื่นอนุมัติ</p></template>
                <template x-if="!mine(t)">
                  <div class="flex flex-wrap gap-2">
                    <button type="button" class="rg-primary-btn" :disabled="busy" @click="review(t, 'approve')"><i class="ic" data-icon="check" aria-hidden="true"></i>อนุมัติ</button>
                    <button type="button" class="btn-outline" :disabled="busy" @click="review(t, 'reject')"><i class="ic" data-icon="x-circle" aria-hidden="true"></i>ไม่อนุมัติ</button>
                  </div>
                </template>
                <a x-show="t.group && !t.group.dissolved" :href="'/manage-groups.html?id=' + (t.group ? t.group.id : '')" class="ml-auto text-sm text-accent">ดูกลุ่ม →</a>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </div>
  </main>
</body>
</html>
